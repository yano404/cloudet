[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detpos"
version = "0.1.0"
description = "Detector position reduction from FARO Quantum-S point clouds"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
viz = ["open3d>=0.17", "matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
detpos = "detpos.cli:main"

[tool.setuptools.packages.find]
include = ["detpos*"]
