[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudet"
version = "0.1.0"
description = "Detector positioning from 3D point clouds (FARO Quantum-S)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    # App UI (required: cloudet is GUI-first)
    "PySide6>=6.5",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
# Open3D: display voxel decimation (C++) and optional RANSAC backend.
open3d = ["open3d>=0.17"]
# GPU compute for fit / residual QC / display voxel (CuPy + CUDA 12.x headers).
gpu = ["cupy-cuda12x[ctk]>=13.0"]
dev = ["pytest>=7"]

[project.scripts]
cloudet = "cloudet.cli:main"

[tool.setuptools.packages.find]
include = ["cloudet*"]
